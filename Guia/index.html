  }

    color: #60a5fa;
    letter-spacing: 0.02em;
  }
  .top-bar .version {
    margin-left: 12px;

    color: #475569;
    font-weight: 400;
  }

  .app {
    display: flex;
    height: calc(100% - 48px);
  }

  /* ── SIDEBAR ── */
  .sidebar {
    width: 224px;
    min-width: 224px;
    background: #1e293b;
    border-right: 1px solid #334155;

    flex-direction: column;
    overflow-y: auto;

  }

  .sidebar::-webkit-scrollbar-track { background: transparent; }
  .sidebar::-webkit-scrollbar-thumb { background: #334155; border-radius: 2px; }

  .group-header {
    padding: 12px 16px;
    font-size: 0.82em;
    font-weight: 700;
    color: #60a5fa;
    cursor: pointer;
    display: flex;
    justify-content: space-between;
    align-items: center;
    user-select: none;
    transition: background 0.15s;
    border-top: 1px solid #263347;
  }
  .group-header:first-child { border-top: none; }
  .group-header:hover { background: rgba(96,165,250,0.06); }
  .group-header .arrow {
    font-size: 0.65em;
    color: #475569;
    transition: transform 0.2s ease;
  }
  .group-header.collapsed .arrow { transform: rotate(-90deg); }

  .group-items { overflow: hidden; }
  .group-items.collapsed { display: none; }

  .nav-item {
    padding: 9px 14px 9px 26px;
    font-size: 0.81em;
    color: #94a3b8;
    cursor: pointer;
    transition: all 0.15s;
    border-left: 3px solid transparent;
    white-space: nowrap;
    overflow: hidden;
    text-overflow: ellipsis;
  }
  .nav-item:hover { color: #e2e8f0; background: rgba(255,255,255,0.04); }
  .nav-item.active {
    color: #93c5fd;
    background: rgba(96,165,250,0.1);
    border-left-color: #3b82f6;
    font-weight: 600;
  }

  /* ── TEMPLATE COPY ROW ── */
  .template-row {
    padding: 9px 14px 9px 26px;
    display: flex;
    align-items: center;
    justify-content: space-between;
    border-left: 3px solid transparent;
  }
  .template-label {
    font-size: 0.81em;
    color: #94a3b8;
    white-space: nowrap;
  }
  .template-btns {
    display: flex;
    gap: 5px;
    flex-shrink: 0;
  }
  .copy-btn {
    padding: 3px 9px;
    border-radius: 5px;
    border: none;
    cursor: pointer;
    font-size: 0.74em;
    font-weight: 700;
    font-family: 'Segoe UI', sans-serif;
    transition: all 0.2s;
    letter-spacing: 0.02em;
  }
  .copy-btn-en { background: #3b82f6; color: #fff; }
  .copy-btn-en:hover { background: #2563eb; }
  .copy-btn-es { background: #10b981; color: #fff; }
  .copy-btn-es:hover { background: #059669; }
  .copy-btn.done { background: #334155 !important; color: #64748b !important; }

  /* ── CONTENT ── */
  .content {
    flex: 1;
    overflow: hidden;
    background: #0f172a;
  }
  .content iframe {
    width: 100%;
    height: 100%;
    border: none;
    display: block;

## \u{1F512} 1. MANDATORY VALIDATION GATE

After presenting the plan and justifications, you must stop and ask for validation for each specific change. **You are not authorized to execute, write, or save any code until the user explicitly confirms each step.**

## \u{1F4DD} 2. CHANGE MANAGEMENT & JUSTIFICATION

You are prohibited from executing changes or writing final code until the following justification process is complete:

### Plan-First Rule
Provide a structured summary of all proposed changes first.

### Domain-Specific Reasoning
- **Data Science & AI/ML:** Explain the methodology. Justify why this specific model/approach was chosen over alternatives and why it fits this specific use case.
- **Tech & Libraries:** Identify all libraries/technologies to be used. Justify their necessity and how they integrate into the existing stack.

For every function or method (native or library-based), detail:
- **Functionality:** Internal logic and purpose.
- **Parameters:** Breakdown of arguments and what they control.

## \u{1F504} 3. CONTEXT MANAGEMENT & CONTINUITY

When accumulated context grows large, recommend the user run \`/compact\` or
\`/clear\` as appropriate:

**When to recommend \`/compact\`:**
- The current task or phase is still in progress (not finished)
- Upcoming work depends on recent details (decisions, code, debugging) that
  should be preserved in summarized form, not discarded
- Context space just needs to be freed up, with no change in scope or goal

**When to recommend \`/clear\`** (and provide a ready-to-paste starter comment
for the next session):
- The current phase or task is complete and what follows has a different scope or goal
- The accumulated context contains information no longer relevant to next steps
  (resolved bugs, prior exploration, discarded approaches)
- The user asks whether it would be convenient to clear the context

**When recommending \`/clear\`, always include:**
A complete, specific comment the user can paste at the start of the next session:
- What was accomplished or decided in the current session
- The exact point where work will resume
- What to do next and in what order

**Starter comment format:**
> Refer to CLAUDE.md
> Context: [brief summary of what was done / where we left off]
> Next: [what to do, starting from [file / function / phase / step]]

Keep it concise but complete enough that the new session needs no re-explanation.

## \u{1F510} 4. GIT COMMITS — ABSOLUTE RULE

This rule never changes, no exceptions:

- **Never** add a \`Co-Authored-By: Claude\` line (or any variant) to commit messages.
- Commits must read as **100% human-authored by the user**: always use the Git identity already configured in the repo (\`user.name\` / \`user.email\`). Never use \`--author\`, never your own identity.
- You **may** run Git commands (\`git commit\`, \`git push\`, etc.) yourself through the terminal (Bash/cmd/PowerShell) — exactly as if the user had typed them. Don't commit through any other channel (API, integration, etc.).
- Before committing, always ask: **"Should I make the commit, or will you?"**. If the user prefers to do it themselves, hand them the commands instead of running them.

  function copyClaude(lang) {
    var content = lang === 'en' ? TEMPLATE_EN : TEMPLATE_ES;
    var btnId = lang === 'en' ? 'btnEN' : 'btnES';
    var btn = document.getElementById(btnId);
    var original = btn.textContent;
    navigator.clipboard.writeText(content).then(function() {
      btn.textContent = '✓';
      btn.classList.add('done');
      setTimeout(function() { btn.textContent = original; btn.classList.remove('done'); }, 2000);
    });
  }

  function toggleGroup(header) {
    header.classList.toggle('collapsed');
    var items = header.nextElementSibling;
    items.classList.toggle('collapsed');
  }

  function loadPage(item, path) {
    document.querySelectorAll('.nav-item').forEach(function(n) { n.classList.remove('active'); });
    item.classList.add('active');
    document.getElementById('contentFrame').src = path;
  }
</script>
